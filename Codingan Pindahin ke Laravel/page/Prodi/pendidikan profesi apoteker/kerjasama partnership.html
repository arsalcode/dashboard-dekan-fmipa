<!-- Section: Kerjasama & Partnership · Pendidikan Profesi Apoteker -->
<div class="section-kerjasama-partnership">
    <div class="dashboard-content-inner">
        <div class="content-left">
            <i class="fas fa-handshake content-icon"></i>
            <div class="content-title-wrapper">
                <h1>Kerjasama & Partnership</h1>
                <div class="content-underline"></div>
            </div>
        </div>
    </div>
    <div class="card-bg">
        <div class="card-bg-fix">
            <div class="w-full mb-5">
                <div class="metric-card-partnership metric-palette-1">
                    <div class="metric-card-header">
                        <span class="metric-card-title">Total Kerjasama</span>
                        <button type="button" class="metric-info-btn" title="Informasi Total Kerjasama Aktif"><i class="fas fa-info"></i></button>
                    </div>
                    <div class="metric-card-body">
                        <span class="metric-main-value" id="valTotalKerjasama">9</span>
                    </div>
                    <div class="metric-card-footer">
                        <span class="metric-subtext" id="subTotalKerjasama">Partnership Aktif: 8 | Berakhir: 1</span>
                    </div>
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5 w-full">
                <div class="chart-card-partnership">
                    <div class="chart-card-header mb-1">
                        <h3 class="chart-title">Partnership Growth Timeline</h3>
                        <span class="chart-info-badge">i</span>
                    </div>
                    <div class="flex flex-wrap items-center justify-center gap-3 mb-2 text-[11px] font-semibold text-gray-600">
                        <div class="flex items-center gap-1.5"><span class="w-3 border-t-2 border-[#E5D026] inline-block"></span><span>Nasional</span></div>
                        <div class="flex items-center gap-1.5"><span class="w-3 border-t-2 border-[#38bdf8] inline-block"></span><span>Internasional</span></div>
                        <div class="flex items-center gap-1.5"><span class="w-3 border-t-2 border-dashed border-[#3D818A] inline-block"></span><span>Total</span></div>
                    </div>
                    <div class="chart-canvas-wrapper"><canvas id="chartPartnershipGrowth"></canvas></div>
                </div>
                <div class="chart-card-partnership">
                    <div class="chart-card-header mb-1">
                        <h3 class="chart-title">Partnership Status (Tahun 2026)</h3>
                        <span class="chart-info-badge">i</span>
                    </div>
                    <div class="chart-canvas-wrapper"><canvas id="chartPartnershipStatus"></canvas></div>
                </div>
            </div>
        </div>
    </div>
</div>
