<!-- Section: SDM Mahasiswa · Pendidikan Profesi Apoteker -->
<div class="section-sdm-mahasiswa">
    <div class="dashboard-content-inner">
        <div class="content-left">
            <i class="fas fa-user-graduate content-icon"></i>
            <div class="content-title-wrapper">
                <h1>SDM Mahasiswa</h1>
                <div class="content-underline"></div>
            </div>
        </div>
    </div>
    <div class="card-bg">
        <div class="card-bg-fix">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-5 w-full">
                <div class="metric-card-mahasiswa metric-palette-1">
                    <div class="metric-card-header"><span class="metric-card-title">Total Mahasiswa</span><button class="metric-info-btn"><i class="fas fa-info"></i></button></div>
                    <div class="metric-card-body"><span class="metric-main-value">125</span></div>
                    <div class="metric-card-footer"><span class="metric-subtext">Aktif: 120</span></div>
                </div>
                <div class="metric-card-mahasiswa metric-palette-2">
                    <div class="metric-card-header"><span class="metric-card-title">IPK Rata-rata</span><button class="metric-info-btn"><i class="fas fa-info"></i></button></div>
                    <div class="metric-card-body"><span class="metric-main-value">3.65</span></div>
                    <div class="metric-card-footer"><span class="metric-subtext">&nbsp;</span></div>
                </div>
                <div class="metric-card-mahasiswa metric-palette-3">
                    <div class="metric-card-header"><span class="metric-card-title">Kelulusan Tepat Waktu</span><button class="metric-info-btn"><i class="fas fa-info"></i></button></div>
                    <div class="metric-card-body"><span class="metric-main-value">96%</span></div>
                    <div class="metric-card-footer"><span class="metric-subtext">&nbsp;</span></div>
                </div>
                <div class="metric-card-mahasiswa metric-palette-4">
                    <div class="metric-card-header"><span class="metric-card-title">Tingkat Retensi</span><button class="metric-info-btn"><i class="fas fa-info"></i></button></div>
                    <div class="metric-card-body"><span class="metric-main-value">98%</span></div>
                    <div class="metric-card-footer"><span class="metric-subtext">&nbsp;</span></div>
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-5 w-full">
                <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 flex flex-col items-center hover:shadow-md transition-all">
                    <div class="flex items-center gap-1.5 mb-3"><h3 class="text-xs font-bold text-gray-700">Distribusi Status Mahasiswa</h3><span class="w-4 h-4 rounded-full bg-blue-100 text-[#0D0B61] flex items-center justify-center text-[10px] font-bold">i</span></div>
                    <div class="w-full h-52 relative"><canvas id="chartStatusMahasiswa"></canvas></div>
                </div>
                <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 flex flex-col items-center hover:shadow-md transition-all">
                    <div class="flex items-center gap-1.5 mb-3"><h3 class="text-xs font-bold text-gray-700">Distribusi IPK Mahasiswa</h3><span class="w-4 h-4 rounded-full bg-blue-100 text-[#0D0B61] flex items-center justify-center text-[10px] font-bold">i</span></div>
                    <div class="w-full h-52 relative"><canvas id="chartIpkMahasiswa"></canvas></div>
                </div>
                <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 flex flex-col items-center hover:shadow-md transition-all">
                    <div class="flex items-center gap-1.5 mb-3"><h3 class="text-xs font-bold text-gray-700">Korelasi IPK vs SKS</h3><span class="w-4 h-4 rounded-full bg-blue-100 text-[#0D0B61] flex items-center justify-center text-[10px] font-bold">i</span></div>
                    <div class="w-full h-52 relative"><canvas id="chartKorelasiIpkSks"></canvas></div>
                </div>
            </div>
        </div>
    </div>
</div>
