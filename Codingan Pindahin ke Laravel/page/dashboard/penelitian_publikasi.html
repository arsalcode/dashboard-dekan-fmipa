<!-- Section: Penelitian & Publikasi -->
<div class="section-penelitian-publikasi">
    <div class="dashboard-content-inner">
        <div class="content-left">
            <i class="fas fa-microscope content-icon"></i>
            <div class="content-title-wrapper">
                <h1>Penelitian & Publikasi</h1>
                <div class="content-underline"></div>
            </div>
        </div>
    </div>

    <!-- Palette Card Container (#0D0B61) -->
    <div class="card-bg">
        <div class="card-bg-fix">
            <!-- 2 Stat Metric Cards (Palette: #294669 & #3D818A) -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 mb-5 w-full">
                <!-- Card 1: Total Penelitian (#294669) -->
                <div class="metric-card-penelitian metric-palette-2">
                    <div class="metric-card-header">
                        <span class="metric-card-title">Total Penelitian</span>
                        <button type="button" class="metric-info-btn" title="Informasi Total Penelitian">
                            <i class="fas fa-info"></i>
                        </button>
                    </div>
                    <div class="metric-card-body">
                        <span class="metric-main-value" id="valTotalPenelitian">148</span>
                    </div>
                    <div class="metric-card-footer">
                        <span class="metric-subtext" id="subTotalPenelitian">Tahun Ini: 42</span>
                    </div>
                </div>

                <!-- Card 2: Publikasi Tahun Ini (#3D818A) -->
                <div class="metric-card-penelitian metric-palette-3">
                    <div class="metric-card-header">
                        <span class="metric-card-title">Publikasi Tahun Ini</span>
                        <button type="button" class="metric-info-btn" title="Informasi Publikasi Tahun Ini">
                            <i class="fas fa-info"></i>
                        </button>
                    </div>
                    <div class="metric-card-body">
                        <span class="metric-main-value" id="valPublikasiTahunIni">86</span>
                    </div>
                    <div class="metric-card-footer">
                        <span class="metric-subtext" id="subPublikasiTahunIni">Scopus & Sinta</span>
                    </div>
                </div>
            </div>

            <!-- 2 Distribution Charts Row -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5 w-full">
                <!-- Chart 1: Proposal Penelitian per Prodi -->
                <div class="chart-card-penelitian">
                    <div class="chart-card-header mb-1">
                        <h3 class="chart-title">Proposal Penelitian per Prodi</h3>
                        <span class="chart-info-badge">i</span>
                    </div>
                    <!-- Custom Chart Legend Matching Reference -->
                    <div class="flex flex-wrap items-center justify-center gap-3 mb-2 text-[11px] font-semibold text-gray-600">
                        <div class="flex items-center gap-1.5">
                            <span class="w-3 h-2 rounded-xs bg-[#0D0B61] inline-block"></span>
                            <span>DIKTI</span>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <span class="w-3 h-2 rounded-xs bg-[#3D818A] inline-block"></span>
                            <span>Internal</span>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <span class="w-3 h-2 rounded-xs bg-[#E5D026] inline-block"></span>
                            <span>Mandiri</span>
                        </div>
                    </div>
                    <div class="chart-canvas-wrapper">
                        <canvas id="chartProposalProdi"></canvas>
                    </div>
                </div>

                <!-- Chart 2: Publikasi Dosen FMIPA -->
                <div class="chart-card-penelitian">
                    <div class="chart-card-header mb-1">
                        <h3 class="chart-title">Publikasi Dosen FMIPA</h3>
                        <span class="chart-info-badge">i</span>
                    </div>
                    <!-- Custom Chart Legend Matching Reference -->
                    <div class="flex flex-wrap items-center justify-center gap-3 mb-2 text-[11px] font-semibold text-gray-600">
                        <div class="flex items-center gap-1.5">
                            <span class="w-3 h-2 rounded-xs bg-[#3D818A] inline-block"></span>
                            <span>Terakreditasi Sinta</span>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <span class="w-3 h-2 rounded-xs bg-[#E5D026] inline-block"></span>
                            <span>Terindeks Scopus</span>
                        </div>
                    </div>
                    <div class="chart-canvas-wrapper">
                        <canvas id="chartPublikasiDosen"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
