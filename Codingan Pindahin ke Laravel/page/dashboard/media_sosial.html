<!-- Section: Media Sosial -->

                <!-- Card 1: Pengunjung Baru Website (#0D0B61 / Palette 1) -->

                    </div>
                    <div class="metric-card-footer">
                        <span class="metric-subtext" id="subPengunjungBaru">Total: 0 kunjungan</span>

                <!-- Card 2: Akun Dijangkau (IG) (#3D818A / Palette 3) -->
                <div class="metric-card-medsos metric-palette-3">
                    <div class="metric-card-header">
                        <span class="metric-card-title">Akun Dijangkau (IG)</span>
                        <button type="button" class="metric-info-btn" title="Informasi Akun Dijangkau Instagram">

                <!-- Card 3: Akses Non-Pengikut (#E5D026 / Palette 4) -->

                    </div>
                    <div class="metric-card-body">
                        <span class="metric-main-value" id="valAksesNonPengikut">30%</span>
                    </div>
                    <div class="metric-card-footer">
                        <span class="metric-subtext" id="subAksesNonPengikut">dari total reach Instagram</span>
