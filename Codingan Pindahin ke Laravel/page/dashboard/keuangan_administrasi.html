<!-- Section: Keuangan & Administrasi -->
<div class="section-keuangan-administrasi">
    <div class="dashboard-content-inner">
        <div class="content-left">
            <i class="fas fa-file-invoice-dollar content-icon"></i>
            <div class="content-title-wrapper">
                <h1>Keuangan & Administrasi</h1>
                <div class="content-underline"></div>
            </div>
        </div>
    </div>

    <!-- Palette Card Container (#0D0B61) -->
    <div class="card-bg">
        <div class="card-bg-fix">
            <!-- 2 Stat Metric Cards (Palette: #E5D026 / #294669 / #0D0B61) -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 w-full">
                <!-- Card 1: Realisasi Anggaran (#E5D026 / Palette 4) -->
                <div class="metric-card-keuangan metric-palette-4">
                    <div class="metric-card-header">
                        <span class="metric-card-title">Realisasi Anggaran</span>
                        <button type="button" class="metric-info-btn" title="Informasi Realisasi Anggaran">
                            <i class="fas fa-info"></i>
                        </button>
                    </div>
                    <div class="metric-card-body">
                        <span class="metric-main-value" id="valRealisasiAnggaran">0%</span>
                    </div>
                    <div class="metric-card-footer">
                        <span class="metric-subtext" id="subRealisasiAnggaran">Tahun Anggaran 2025/2026</span>
                    </div>
                </div>

                <!-- Card 2: Akreditasi Rata-rata (#0D0B61 / Palette 1) -->
                <div class="metric-card-keuangan metric-palette-1">
                    <div class="metric-card-header">
                        <span class="metric-card-title">Akreditasi Rata-rata</span>
                        <button type="button" class="metric-info-btn" title="Informasi Akreditasi Rata-rata">
                            <i class="fas fa-info"></i>
                        </button>
                    </div>
                    <div class="metric-card-body">
                        <span class="metric-main-value" id="valAkreditasiRataRata">N/A</span>
                    </div>
                    <div class="metric-card-footer">
                        <span class="metric-subtext" id="subAkreditasiRataRata">6 Program Studi FMIPA</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
