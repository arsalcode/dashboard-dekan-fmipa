<!-- Section: Kerjasama & Partnership -->
<div class="section-kerjasama-partnership">
    <div class="dashboard-content-inner">
        <div class="content-left">
            <i class="fas fa-handshake content-icon"></i>
            <div class="content-title-wrapper">
                <h1>Kerjasama & Partnership</h1>
                <div class="content-underline"></div>
            </div>
        </div>
    </div>

    <!-- Palette Card Container (#0D0B61) -->
    <div class="card-bg">
        <div class="card-bg-fix">
            <!-- 1 Wide Stat Metric Card (#0D0B61 / Palette 1) -->
            <div class="w-full mb-5">
                <div class="metric-card-partnership metric-palette-1">
                    <div class="metric-card-header">
                        <span class="metric-card-title">Total Kerjasama</span>
                        <button type="button" class="metric-info-btn" title="Informasi Total Kerjasama Aktif">
                            <i class="fas fa-info"></i>
                        </button>
                    </div>
                    <div class="metric-card-body">
                        <span class="metric-main-value" id="valTotalKerjasama">48</span>
                    </div>
                    <div class="metric-card-footer">
                        <span class="metric-subtext" id="subTotalKerjasama">Partnership Aktif: 42 | Berakhir: 6</span>
                    </div>
                </div>
            </div>

            <!-- 2 Charts Row -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5 w-full">
                <!-- Chart 1: Partnership Growth Timeline -->
                <div class="chart-card-partnership">
                    <div class="chart-card-header mb-1">
                        <h3 class="chart-title">Partnership Growth Timeline</h3>
                        <span class="chart-info-badge">i</span>
                    </div>
                    <!-- Custom Chart Legend -->
                    <div class="flex flex-wrap items-center justify-center gap-3 mb-2 text-[11px] font-semibold text-gray-600">
                        <div class="flex items-center gap-1.5">
                            <span class="w-3 border-t-2 border-[#E5D026] inline-block"></span>
                            <span>Nasional</span>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <span class="w-3 border-t-2 border-[#38bdf8] inline-block"></span>
                            <span>Internasional</span>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <span class="w-3 border-t-2 border-dashed border-[#3D818A] inline-block"></span>
                            <span>Total</span>
                        </div>
                    </div>
                    <div class="chart-canvas-wrapper">
                        <canvas id="chartPartnershipGrowth"></canvas>
                    </div>
                </div>

                <!-- Chart 2: Partnership Status (Tahun 2026) -->
                <div class="chart-card-partnership">
                    <div class="chart-card-header mb-1">
                        <h3 class="chart-title">Partnership Status (Tahun 2026)</h3>
                        <span class="chart-info-badge">i</span>
                    </div>
                    <div class="chart-canvas-wrapper">
                        <canvas id="chartPartnershipStatus"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
