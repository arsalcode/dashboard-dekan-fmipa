<!-- ============================================ -->
<!-- SEKSI: DATA DOSEN FMIPA PER PRODI -->
<!-- Dibungkus Rapi Sesuai Mockup Container Ungu -->
<!-- ============================================ -->
<div class="section-data-dosen-prodi">
  
  <!-- Header Title & Subtitle Bergaya Wakil Dekan 1 -->
  <div class="dashboard-content-inner px-0 pt-0 pb-2">
    <div class="content-left flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-emerald-100 flex items-center justify-center text-[#2d6a4f] shadow-sm">
        <i class="fas fa-users text-lg"></i>
      </div>
      <div class="content-title-wrapper">
        <h1 class="text-xl font-bold text-gray-800">Data Dosen FMIPA Per Prodi</h1>
        <div class="content-underline"></div>
      </div>
    </div>
  </div>
  <p class="dosen-header-subtitle mb-4">
    Daftar lengkap dosen berdasarkan program studi dan kategori (Dosen Homebase &amp; Penghitung Rasio)
  </p>

  <!-- Container Pembungkus Ungu (#722F99) Persis Sesuai Gambar Screenshot -->
  <div class="card-bg">
    <div class="data-dosen-overview-container">

      <!-- Toolbar Atas: Search Box & Export Buttons -->
      <div class="data-dosen-toolbar-top">
        <div class="data-dosen-search-box">
          <i class="fas fa-search data-dosen-search-icon"></i>
          <input type="text" id="searchDosenInput" placeholder="Cari dosen..." title="Cari berdasarkan nama dosen atau NIDN" />
        </div>
        <div class="data-dosen-actions-area">
          <button type="button" id="btnExportCsv" class="btn-export-dosen" title="Export ke CSV">
            <i class="far fa-file-alt"></i>
            <span>CSV</span>
          </button>
          <button type="button" id="btnExportExcel" class="btn-export-dosen" title="Export ke Excel">
            <i class="far fa-file-excel text-emerald-600"></i>
            <span>Excel</span>
          </button>
          <button type="button" id="btnExportPrint" class="btn-export-dosen" title="Cetak / Print Data">
            <i class="fas fa-print"></i>
            <span>Print</span>
          </button>
          <button type="button" id="btnExportCopy" class="btn-export-dosen" title="Salin ke Clipboard">
            <i class="far fa-copy"></i>
            <span>Copy</span>
          </button>
        </div>
      </div>

      <!-- Prodi Tabs Pills (Persis Screenshot) -->
      <div class="data-dosen-prodi-tabs" id="dataDosenProdiTabs">
        <button type="button" class="btn-data-prodi-tab active" data-prodi-target="biologi">Biologi</button>
        <button type="button" class="btn-data-prodi-tab" data-prodi-target="kimia">Kimia</button>
        <button type="button" class="btn-data-prodi-tab" data-prodi-target="matematika">Matematika</button>
        <button type="button" class="btn-data-prodi-tab" data-prodi-target="ilmu-komputer">Ilmu Komputer</button>
        <button type="button" class="btn-data-prodi-tab" data-prodi-target="farmasi">Farmasi</button>
        <button type="button" class="btn-data-prodi-tab" data-prodi-target="ppa">Pendidikan Profesi Apoteker</button>
        <button type="button" class="btn-data-prodi-tab" data-prodi-target="lainnya">
          <i class="fas fa-tags text-[11px]"></i>
          <span>Lainnya</span>
        </button>
      </div>

      <!-- Kategori Filter Bar & Count Badge -->
      <div class="data-dosen-kategori-row">
        <div class="data-dosen-kategori-group">
          <span class="data-dosen-kategori-label">Kategori:</span>
          <button type="button" class="btn-data-kategori-pill active" data-kategori-target="homebase">
            <i class="fas fa-home text-xs text-amber-300"></i>
            <span>Dosen Homebase</span>
          </button>
          <button type="button" class="btn-data-kategori-pill" data-kategori-target="rasio">
            <i class="fas fa-chart-pie text-xs text-emerald-400"></i>
            <span>Penghitung Rasio</span>
          </button>
        </div>

        <div id="labelDosenCountBadge" class="data-dosen-count-badge">
          0 Dosen Homebase di Biologi
        </div>
      </div>

      <!-- Tabel Data Dosen (White Card Container) -->
      <div class="data-dosen-table-wrap">
        <table class="data-dosen-table" id="tabelDataDosenFmipa">
          <thead>
            <tr>
              <th class="w-12 text-center">No</th>
              <th>Nama Dosen</th>
              <th>Jenis Kelamin</th>
              <th>NIDN</th>
              <th>NIDK</th>
              <th>Status Dosen</th>
              <th>Status Sertifikasi Dosen</th>
              <th>Jabatan Akademik Terakhir</th>
              <th>Strata Pendidikan Terakhir</th>
            </tr>
          </thead>
          <tbody id="tabelDataDosenBody">
            <!-- Diisi dinamis oleh script.js -->
          </tbody>
        </table>
      </div>

    </div>
  </div>

</div>
