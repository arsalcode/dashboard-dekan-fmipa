<!-- ============================================ -->
<!-- SEKSI: DATA MAHASISWA FMIPA PER PRODI -->
<!-- ============================================ -->
<div class="section-data-mahasiswa-prodi">
  
  <!-- Header Title & Subtitle Bergaya Wakil Dekan 1 & Dosen -->
  <div class="dashboard-content-inner px-0 pt-0 pb-2">
    <div class="content-left flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-emerald-100 flex items-center justify-center text-[#2d6a4f] shadow-sm">
        <i class="fas fa-users-cog text-lg"></i>
      </div>
      <div class="content-title-wrapper">
        <h1 class="text-xl font-bold text-gray-800">Data Mahasiswa FMIPA Per Prodi</h1>
        <div class="content-underline"></div>
      </div>
    </div>
  </div>
  <p class="mhs-header-subtitle mb-4">
    Daftar lengkap mahasiswa aktif, penerima beasiswa, dan progres studi per program studi
  </p>

  <!-- Container Pembungkus Hijau Sage (#8BBB92) -->
  <div class="card-bg">
    <div class="data-mhs-overview-container">

      <!-- Toolbar Atas: Search Box & Export Buttons -->
      <div class="data-mhs-toolbar-top">
        <div class="data-mhs-search-box">
          <i class="fas fa-search data-mhs-search-icon"></i>
          <input type="text" id="searchMhsInput" placeholder="Cari nama atau NPM mahasiswa..." title="Cari berdasarkan nama atau NPM" />
        </div>
        <div class="data-mhs-actions-area">
          <button type="button" id="btnExportMhsCsv" class="btn-export-mhs" title="Export ke CSV">
            <i class="far fa-file-alt"></i>
            <span>CSV</span>
          </button>
          <button type="button" id="btnExportMhsExcel" class="btn-export-mhs" title="Export ke Excel">
            <i class="far fa-file-excel text-emerald-600"></i>
            <span>Excel</span>
          </button>
          <button type="button" id="btnExportMhsPrint" class="btn-export-mhs" title="Cetak / Print Data">
            <i class="fas fa-print"></i>
            <span>Print</span>
          </button>
          <button type="button" id="btnExportMhsCopy" class="btn-export-mhs" title="Salin ke Clipboard">
            <i class="far fa-copy"></i>
            <span>Copy</span>
          </button>
        </div>
      </div>

      <!-- Prodi Tabs Pills -->
      <div class="data-mhs-prodi-tabs" id="dataMhsProdiTabs">
        <button type="button" class="btn-data-mhs-tab active" data-mhs-target="biologi">Biologi</button>
        <button type="button" class="btn-data-mhs-tab" data-mhs-target="kimia">Kimia</button>
        <button type="button" class="btn-data-mhs-tab" data-mhs-target="matematika">Matematika</button>
        <button type="button" class="btn-data-mhs-tab" data-mhs-target="ilmu-komputer">Ilmu Komputer</button>
        <button type="button" class="btn-data-mhs-tab" data-mhs-target="farmasi">Farmasi</button>
        <button type="button" class="btn-data-mhs-tab" data-mhs-target="ppa">Profesi Apoteker</button>
      </div>

      <!-- Kategori Filter Bar & Count Badge -->
      <div class="data-mhs-kategori-row">
        <div class="data-mhs-kategori-group">
          <span class="data-mhs-kategori-label">Kategori:</span>
          <button type="button" class="btn-mhs-kategori-pill active" data-kategori-mhs-target="reguler">
            <i class="fas fa-graduation-cap text-xs text-amber-300"></i>
            <span>Mahasiswa Reguler</span>
          </button>
          <button type="button" class="btn-mhs-kategori-pill" data-kategori-mhs-target="beasiswa">
            <i class="fas fa-medal text-xs text-emerald-300"></i>
            <span>Penerima Beasiswa</span>
          </button>
        </div>

        <div id="labelMhsCountBadge" class="data-mhs-count-badge">
          0 Mahasiswa Reguler di Biologi
        </div>
      </div>

      <!-- Tabel Data Mahasiswa (White Card Container) -->
      <div class="data-mhs-table-wrap">
        <table class="data-mhs-table" id="tabelDataMahasiswaFmipa">
          <thead>
            <tr>
              <th class="w-12 text-center">No</th>
              <th>NPM</th>
              <th>Nama Mahasiswa</th>
              <th>Jenis Kelamin</th>
              <th>Angkatan</th>
              <th>IPK</th>
              <th>Status</th>
              <th>Jalur Masuk</th>
              <th>Dosen PA</th>
            </tr>
          </thead>
          <tbody id="tabelDataMahasiswaBody">
            <!-- Diisi dinamis oleh script.js -->
          </tbody>
        </table>
      </div>

    </div>
  </div>

</div>
