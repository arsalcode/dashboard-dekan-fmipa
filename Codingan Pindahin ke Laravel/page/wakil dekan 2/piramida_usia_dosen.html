<!-- Section 3: Piramida Usia Dosen & Distribusi Beasiswa -->
<div class="section-piramida-usia">
    <div class="dashboard-content-inner flex flex-col sm:flex-row sm:items-center sm:justify-between mb-4">
        <div class="content-left">
            <i class="fas fa-user-clock content-icon"></i>
            <div class="content-title-wrapper">
                <h1>Piramida Usia Dosen</h1>
                <div class="content-underline"></div>
            </div>
        </div>
        <p class="text-xs text-gray-500 mt-2 sm:mt-0 font-medium">Demografi usia dosen (L/P) dan sebaran beasiswa mahasiswa</p>
    </div>

    <!-- Container 2 Kartu Grafik -->
    <div class="card-bg">
        <div class="piramida-usia-container">
            <div class="wd2-piramida-grid">

                <!-- Grafik 1: Piramida Usia Dosen (L/P) (Horizontal Bar Chart) -->
                <div class="wd2-chart-card">
                    <div class="wd2-chart-header">
                        <div class="wd2-header-spacer"></div>
                        <h4 class="wd2-chart-title">Piramida Usia Dosen (L/P)</h4>
                        <button type="button" class="wd2-chart-info-btn" title="Distribusi rentang usia dosen berdasarkan jenis kelamin Laki-laki dan Perempuan">
                            <i class="fas fa-info-circle"></i>
                        </button>
                    </div>
                    <!-- Custom Legend Sesuai Screenshot -->
                    <div class="wd2-chart-legend">
                        <div class="wd2-legend-item">
                            <span class="wd2-legend-box wd2-legend-male"></span>
                            <span>Laki-laki</span>
                        </div>
                        <div class="wd2-legend-item">
                            <span class="wd2-legend-box wd2-legend-female"></span>
                            <span>Perempuan</span>
                        </div>
                    </div>
                    <div class="wd2-chart-body">
                        <canvas id="chartWd2PiramidaUsia"></canvas>
                    </div>
                </div>

                <!-- Grafik 2: Distribusi Beasiswa per Jenis (Doughnut Chart) -->
                <div class="wd2-chart-card">
                    <div class="wd2-chart-header">
                        <div class="wd2-header-spacer"></div>
                        <h4 class="wd2-chart-title">Distribusi Beasiswa per Jenis</h4>
                        <button type="button" class="wd2-chart-info-btn" title="Sebaran jumlah penerima beasiswa berdasarkan skema atau jenis beasiswa">
                            <i class="fas fa-info-circle"></i>
                        </button>
                    </div>
                    <div class="wd2-chart-body">
                        <canvas id="chartWd2DistribusiBeasiswa"></canvas>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
