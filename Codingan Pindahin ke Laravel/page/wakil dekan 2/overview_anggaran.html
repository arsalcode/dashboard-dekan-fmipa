<!-- Section 1: Overview Anggaran -->
<div class="section-overview-anggaran">
    <div class="dashboard-content-inner">
        <div class="content-left">
            <i class="fas fa-wallet content-icon"></i>
            <div class="content-title-wrapper">
                <h1>Overview Anggaran</h1>
                <div class="content-underline"></div>
            </div>
        </div>
    </div>

    <!-- Container Kartu & Grafik Overview Anggaran -->
    <div class="card-bg">
        <div class="overview-anggaran-container">

            <!-- 4 Kartu Metrik Utama -->
            <div class="wd2-stat-grid">
                <!-- Card 1: Total Anggaran Disetujui (Purple) -->
                <div class="wd2-card wd2-card-purple">
                    <div class="wd2-card-header">
                        <span class="wd2-card-title">Total Anggaran Disetujui</span>
                        <button type="button" class="wd2-card-info-btn" title="Total Anggaran yang Disetujui untuk Tahun 2026">
                            <i class="fas fa-info-circle"></i>
                        </button>
                    </div>
                    <div class="wd2-card-body">
                        <span class="wd2-card-value" id="valWd2AnggaranDisetujui">Rp 0.0M</span>
                    </div>
                    <div class="wd2-card-footer">
                        <span class="wd2-card-subtext" id="subWd2AnggaranDisetujui">Tahun 2026</span>
                    </div>
                </div>

                <!-- Card 2: Realisasi Anggaran (Green / Mint) -->
                <div class="wd2-card wd2-card-green">
                    <div class="wd2-card-header">
                        <span class="wd2-card-title">Realisasi Anggaran</span>
                        <button type="button" class="wd2-card-info-btn" title="Persentase dan Nominal Realisasi Anggaran Berjalan">
                            <i class="fas fa-info-circle"></i>
                        </button>
                    </div>
                    <div class="wd2-card-body">
                        <span class="wd2-card-value" id="valWd2RealisasiPersen">0%</span>
                    </div>
                    <div class="wd2-card-footer">
                        <span class="wd2-card-subtext" id="subWd2RealisasiNominal">Rp 0.0M</span>
                    </div>
                </div>

                <!-- Card 3: Sisa Anggaran (Coral / Salmon) -->
                <div class="wd2-card wd2-card-coral">
                    <div class="wd2-card-header">
                        <span class="wd2-card-title">Sisa Anggaran</span>
                        <button type="button" class="wd2-card-info-btn" title="Sisa Anggaran yang Belum Terealisasi">
                            <i class="fas fa-info-circle"></i>
                        </button>
                    </div>
                    <div class="wd2-card-body">
                        <span class="wd2-card-value" id="valWd2SisaAnggaran">Rp 0.0M</span>
                    </div>
                    <div class="wd2-card-footer">
                        <span class="wd2-card-subtext" id="subWd2SisaAnggaran">Belum terealisasi</span>
                    </div>
                </div>

                <!-- Card 4: Total Beasiswa Diberikan (Magenta) -->
                <div class="wd2-card wd2-card-magenta">
                    <div class="wd2-card-header">
                        <span class="wd2-card-title">Total Beasiswa Diberikan</span>
                        <button type="button" class="wd2-card-info-btn" title="Jumlah Penerima dan Total Nilai Beasiswa">
                            <i class="fas fa-info-circle"></i>
                        </button>
                    </div>
                    <div class="wd2-card-body">
                        <span class="wd2-card-value" id="valWd2TotalBeasiswa">0</span>
                    </div>
                    <div class="wd2-card-footer">
                        <span class="wd2-card-subtext" id="subWd2NominalBeasiswa">Rp 0.0M</span>
                    </div>
                </div>
            </div>

            <!-- 2 Grafik Grid -->
            <div class="wd2-charts-grid">
                <!-- Grafik 1: Anggaran per Kategori (Bar Chart) -->
                <div class="wd2-chart-card">
                    <div class="wd2-chart-header">
                        <div class="wd2-header-spacer"></div>
                        <h4 class="wd2-chart-title">Anggaran per Kategori</h4>
                        <button type="button" class="wd2-chart-info-btn" title="Perbandingan Alokasi Anggaran Disetujui dan Realisasi per Kategori">
                            <i class="fas fa-info-circle"></i>
                        </button>
                    </div>
                    <div class="wd2-chart-legend">
                        <div class="wd2-legend-item">
                            <span class="wd2-legend-box wd2-legend-blue"></span>
                            <span>Disetujui</span>
                        </div>
                        <div class="wd2-legend-item">
                            <span class="wd2-legend-box wd2-legend-green"></span>
                            <span>Realisasi</span>
                        </div>
                    </div>
                    <div class="wd2-chart-body">
                        <canvas id="chartWd2AnggaranKategori"></canvas>
                    </div>
                </div>

                <!-- Grafik 2: Tren Realisasi Bulanan (Line Chart) -->
                <div class="wd2-chart-card">
                    <div class="wd2-chart-header">
                        <div class="wd2-header-spacer"></div>
                        <h4 class="wd2-chart-title">Tren Realisasi Bulanan</h4>
                        <button type="button" class="wd2-chart-info-btn" title="Tren Rencana Anggaran vs Realisasi per Bulan">
                            <i class="fas fa-info-circle"></i>
                        </button>
                    </div>
                    <div class="wd2-chart-legend">
                        <div class="wd2-legend-item">
                            <span class="wd2-legend-box-outline wd2-legend-outline-blue"></span>
                            <span>Direncanakan</span>
                        </div>
                        <div class="wd2-legend-item">
                            <span class="wd2-legend-box-outline wd2-legend-outline-green"></span>
                            <span>Realisasi</span>
                        </div>
                    </div>
                    <div class="wd2-chart-body">
                        <canvas id="chartWd2TrenRealisasi"></canvas>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
