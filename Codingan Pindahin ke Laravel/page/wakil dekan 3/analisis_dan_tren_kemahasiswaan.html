<!-- Section 3: Analisis & Tren Kemahasiswaan -->
<div class="section-analisis-tren">
    <div class="dashboard-content-inner">
        <div class="content-left">
            <i class="fas fa-chart-line content-icon"></i>
            <div class="content-title-wrapper">
                <h1>Analisis &amp; Tren Kemahasiswaan</h1>
                <div class="content-underline"></div>
            </div>
        </div>
    </div>

    <!-- Container Grafik Analisis & Tren Kemahasiswaan (Background: #8BBB92) -->
    <div class="card-bg">
        <div class="card-bg-fix analisis-tren-container">

            <!-- Baris Atas: 2 Grafik Utama -->
            <div class="wd3-charts-row-2">
                <!-- Grafik 1: Distribusi Mahasiswa per Angkatan -->
                <div class="wd3-tren-chart-card">
                    <div class="wd3-tren-chart-header">
                        <h4 class="wd3-tren-chart-title">Distribusi Mahasiswa per Angkatan</h4>
                        <button type="button" class="wd3-tren-chart-info-btn" title="Distribusi Mahasiswa Aktif Berdasarkan Tahun Angkatan">
                            <i class="fas fa-info"></i>
                        </button>
                    </div>
                    <div class="wd3-tren-chart-body">
                        <canvas id="chartWd3MhsAngkatan"></canvas>
                    </div>
                </div>

                <!-- Grafik 2: Tren Kegiatan Kemahasiswaan (Dual Axis Line/Area) -->
                <div class="wd3-tren-chart-card">
                    <div class="wd3-tren-chart-header">
                        <h4 class="wd3-tren-chart-title">Tren Kegiatan Kemahasiswaan</h4>
                        <button type="button" class="wd3-tren-chart-info-btn" title="Tren Jumlah Kegiatan dan Total Partisipasi Bulanan">
                            <i class="fas fa-info"></i>
                        </button>
                    </div>
                    <div class="wd3-tren-legend">
                        <div class="wd3-tren-legend-item">
                            <span class="wd3-legend-box-kegiatan"></span>
                            <span>Jumlah Kegiatan</span>
                        </div>
                        <div class="wd3-tren-legend-item">
                            <span class="wd3-legend-box-partisipasi"></span>
                            <span>Total Partisipasi</span>
                        </div>
                    </div>
                    <div class="wd3-tren-chart-body">
                        <canvas id="chartWd3TrenKegiatanTahunan"></canvas>
                    </div>
                </div>
            </div>

            <!-- Baris Bawah: 3 Grafik Komparasi -->
            <div class="wd3-charts-row-3">
                <!-- Grafik 3: Distribusi Jenis Prestasi -->
                <div class="wd3-tren-chart-card">
                    <div class="wd3-tren-chart-header">
                        <h4 class="wd3-tren-chart-title">Distribusi Jenis Prestasi</h4>
                        <button type="button" class="wd3-tren-chart-info-btn" title="Distribusi Prestasi Mahasiswa Berdasarkan Kategori">
                            <i class="fas fa-info"></i>
                        </button>
                    </div>
                    <div class="wd3-tren-chart-body">
                        <canvas id="chartWd3DistribusiPrestasi"></canvas>
                    </div>
                </div>

                <!-- Grafik 4: Jenis Organisasi Mahasiswa (Donut Chart) -->
                <div class="wd3-tren-chart-card">
                    <div class="wd3-tren-chart-header">
                        <h4 class="wd3-tren-chart-title">Jenis Organisasi Mahasiswa</h4>
                        <button type="button" class="wd3-tren-chart-info-btn" title="Proporsi Organisasi Mahasiswa Berdasarkan Jenis Lembaga">
                            <i class="fas fa-info"></i>
                        </button>
                    </div>
                    <div class="wd3-tren-chart-body">
                        <canvas id="chartWd3JenisOrmawa"></canvas>
                    </div>
                </div>

                <!-- Grafik 5: Partisipasi per Prodi (Bar Chart) -->
                <div class="wd3-tren-chart-card">
                    <div class="wd3-tren-chart-header">
                        <h4 class="wd3-tren-chart-title">Partisipasi per Prodi</h4>
                        <button type="button" class="wd3-tren-chart-info-btn" title="Tingkat Partisipasi Kegiatan per Program Studi">
                            <i class="fas fa-info"></i>
                        </button>
                    </div>
                    <div class="wd3-tren-chart-body">
                        <canvas id="chartWd3PartisipasiProdi"></canvas>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
