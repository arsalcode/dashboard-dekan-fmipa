<!-- Section 1: Overview Mahasiswa -->
<div class="section-overview-mahasiswa">
    <div class="dashboard-content-inner">
        <div class="content-left">
            <i class="fas fa-users-cog content-icon"></i>
            <div class="content-title-wrapper">
                <h1>Overview Mahasiswa</h1>
                <div class="content-underline"></div>
            </div>
        </div>
    </div>

    <!-- Container Kartu Overview Mahasiswa (Background: #8BBB92) -->
    <div class="card-bg">
        <div class="card-bg-fix overview-mahasiswa-container">

            <!-- 4 Stat Metric Cards (Palette Sesuai Dashboard: #0D0B61 | #294669 | #3D818A | #E5D026) -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 w-full">
                <!-- Card 1: Total Mahasiswa Aktif (#0D0B61) -->
                <div class="metric-card-mahasiswa metric-palette-1 wd3-card">
                    <div class="metric-card-header">
                        <span class="metric-card-title">Total Mahasiswa Aktif</span>
                        <button type="button" class="metric-info-btn" title="Total Mahasiswa Aktif & Proporsi Gender">
                            <i class="fas fa-info"></i>
                        </button>
                    </div>
                    <div class="metric-card-body">
                        <span class="metric-main-value" id="valWd3TotalMhs">0</span>
                    </div>
                    <div class="metric-card-footer">
                        <span class="metric-subtext" id="subWd3TotalMhs">L: 0% · P: 0%</span>
                    </div>
                </div>

                <!-- Card 2: Organisasi Mahasiswa (#294669) -->
                <div class="metric-card-mahasiswa metric-palette-2 wd3-card">
                    <div class="metric-card-header">
                        <span class="metric-card-title">Organisasi Mahasiswa</span>
                        <button type="button" class="metric-info-btn" title="Jumlah Organisasi Mahasiswa & Anggota Terdaftar">
                            <i class="fas fa-info"></i>
                        </button>
                    </div>
                    <div class="metric-card-body">
                        <span class="metric-main-value" id="valWd3Ormawa">22</span>
                    </div>
                    <div class="metric-card-footer">
                        <span class="metric-subtext" id="subWd3Ormawa">450 anggota terdaftar</span>
                    </div>
                </div>

                <!-- Card 3: Kegiatan Kemahasiswaan (#3D818A) -->
                <div class="metric-card-mahasiswa metric-palette-3 wd3-card">
                    <div class="metric-card-header">
                        <span class="metric-card-title">Kegiatan Kemahasiswaan</span>
                        <button type="button" class="metric-info-btn" title="Status Pelaksanaan Kegiatan Kemahasiswaan">
                            <i class="fas fa-info"></i>
                        </button>
                    </div>
                    <div class="metric-card-body">
                        <span class="metric-main-value" id="valWd3Kegiatan">45</span>
                    </div>
                    <div class="metric-card-footer">
                        <span class="metric-subtext" id="subWd3Kegiatan">32 selesai · 10 berjalan</span>
                    </div>
                </div>

                <!-- Card 4: Tingkat Partisipasi (#E5D026) -->
                <div class="metric-card-mahasiswa metric-palette-4 wd3-card">
                    <div class="metric-card-header">
                        <span class="metric-card-title">Tingkat Partisipasi</span>
                        <button type="button" class="metric-info-btn" title="Rata-rata Tingkat Kehadiran & Partisipasi Kegiatan">
                            <i class="fas fa-info"></i>
                        </button>
                    </div>
                    <div class="metric-card-body">
                        <span class="metric-main-value" id="valWd3Partisipasi">85.5%</span>
                    </div>
                    <div class="metric-card-footer">
                        <span class="metric-subtext" id="subWd3Partisipasi">Kehadiran rata-rata kegiatan</span>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
