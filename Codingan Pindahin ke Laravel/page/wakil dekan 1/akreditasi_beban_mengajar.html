<!-- Section 3: Akreditasi & Beban Mengajar -->
<div class="section-akreditasi-beban-mengajar">
    <div class="dashboard-content-inner px-0 pt-0 pb-5">
        <div class="content-left">
            <i class="fas fa-award content-icon"></i>
            <div class="content-title-wrapper">
                <h1>Akreditasi &amp; Beban Mengajar</h1>
                <div class="content-underline"></div>
            </div>
        </div>
    </div>

    <!-- Palette Card Container (background #8BBB92) -->
    <div class="card-bg">
        <div class="akr-card-bg-fix">

            <!-- 3 Stat Metric Cards with Vibrant Modern Gradients -->
            <div class="akr-stat-grid">
                <!-- Card 1: Rata-rata SKS Mengajar -->
                <div class="akr-card akr-card-indigo">
                    <div class="akr-card-header">
                        <span class="akr-card-title">Rata-rata SKS Mengajar</span>
                        <button type="button" class="akr-card-info-btn" title="Rata-rata beban SKS mengajar per dosen">i</button>
                    </div>
                    <div class="akr-card-body">
                        <span class="akr-card-value" id="valAkrRataSks">14.2</span>
                    </div>
                    <div class="akr-card-footer">
                        <span class="akr-card-subtext" id="subAkrRataSks">SKS per dosen</span>
                    </div>
                </div>

                <!-- Card 2: Dosen Overload (>16 SKS) -->
                <div class="akr-card akr-card-pink">
                    <div class="akr-card-header">
                        <span class="akr-card-title">Dosen Overload (&gt;16 SKS)</span>
                        <button type="button" class="akr-card-info-btn" title="Jumlah dosen dengan beban mengajar melebihi 16 SKS">i</button>
                    </div>
                    <div class="akr-card-body">
                        <span class="akr-card-value" id="valAkrOverload">8</span>
                    </div>
                    <div class="akr-card-footer">
                        <span class="akr-card-subtext" id="subAkrOverload">&nbsp;</span>
                    </div>
                </div>

                <!-- Card 3: Dosen Underload (<12 SKS) -->
                <div class="akr-card akr-card-cyan">
                    <div class="akr-card-header">
                        <span class="akr-card-title">Dosen Underload (&lt;12 SKS)</span>
                        <button type="button" class="akr-card-info-btn" title="Jumlah dosen dengan beban mengajar di bawah 12 SKS">i</button>
                    </div>
                    <div class="akr-card-body">
                        <span class="akr-card-value" id="valAkrUnderload">5</span>
                    </div>
                    <div class="akr-card-footer">
                        <span class="akr-card-subtext" id="subAkrUnderload">&nbsp;</span>
                    </div>
                </div>
            </div>

            <!-- 2 Charts Grid -->
            <div class="akr-charts-grid">
                <!-- Chart 1: Skor Akreditasi per Prodi -->
                <div class="akr-chart-card">
                    <div class="akr-chart-header">
                        <div style="width: 20px;"></div>
                        <h4 class="akr-chart-title">Skor Akreditasi per Prodi</h4>
                        <button type="button" class="akr-chart-info-btn" title="Skor evaluasi akreditasi tiap program studi">i</button>
                    </div>
                    <div class="akr-chart-body">
                        <canvas id="chartWd1SkorAkreditasi"></canvas>
                    </div>
                </div>

                <!-- Chart 2: Rasio Kelulusan Tepat Waktu per Prodi -->
                <div class="akr-chart-card">
                    <div class="akr-chart-header">
                        <div style="width: 20px;"></div>
                        <h4 class="akr-chart-title">Rasio Kelulusan Tepat Waktu per Prodi</h4>
                        <button type="button" class="akr-chart-info-btn" title="Persentase kelulusan tepat waktu per program studi">i</button>
                    </div>
                    <div class="akr-chart-body">
                        <canvas id="chartWd1RasioKelulusanProdi"></canvas>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
